<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>No internet</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f8; font-family: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif; color: #111827; text-align: center; padding: 24px; box-sizing: border-box; }
        .box { max-width: 340px; }
        img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 8px 24px rgba(16,24,40,.1); }
        h1 { font-size: 22px; margin: 22px 0 8px; }
        p { color: #667085; margin: 0 0 22px; line-height: 1.5; }
        button { background: #111827; color: #fff; border: 0; border-radius: 12px; padding: 13px 26px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <img src="/images/app/icon-192.png" alt="">
        <h1>No internet connection</h1>
        <p>Please check your Wi-Fi or mobile data. Your sales and stock are safe on the server.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
